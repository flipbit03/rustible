[package]
name = "rustible"
description = "Rustible: configuration management as real code. Typed Rust playbooks compiled to static binaries, no YAML, no remote interpreter."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"

# Forwards the SDK's test API and re-exports `#[integration_test]`. A test
# crate turns it on in `[dev-dependencies]` only.
[features]
testing = ["rustible-sdk/testing"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
rustible-sdk.workspace = true
rustible-macros.workspace = true
rustible-std.workspace = true

[dev-dependencies]
# The `Fake` and `testing::ctx`, for the masking tests in `tests/template.rs`.
rustible-sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
