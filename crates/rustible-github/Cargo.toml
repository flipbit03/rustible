[package]
name = "rustible-github"
description = "Rustible collection for GitHub: fetch a user's SSH keys and other GitHub-backed operations."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"

# A collection depends on the SDK and, when it composes with standard ops, on
# rustible-std. Never on rustible-cli (vision 9).
[dependencies]
rustible-sdk.workspace = true
# HTTPS for the `.keys` endpoint is `rustible_std::http::Request::send`: no
# HTTP client and no crypto entry of its own, so this crate and the standard
# ops agree on TLS, redirects and limits by construction.
rustible-std.workspace = true

[dev-dependencies]
# Only so the module-header doctest can show a real `#[rustible::playbook]`.
# Path-only on purpose: cargo strips a path-only dev-dependency at publish, the
# same reason rustible-std and rustible-macros carry it this way.
rustible = { path = "../rustible" }
