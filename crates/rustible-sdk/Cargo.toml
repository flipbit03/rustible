[package]
name = "rustible-sdk"
description = "SDK for writing Rustible operations and playbooks"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"

# The test API: the container harness (`testing`), the `Fake` backend, and the
# constructors that build a `System` or a `Ctx` from parts. A test crate turns
# it on in `[dev-dependencies]` only, so no playbook binary contains it.
[features]
testing = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow = "1"
similar.workspace = true
tempfile.workspace = true
rustix.workspace = true
zeroize.workspace = true
base64.workspace = true
schemars = { version = "1", default-features = false, features = ["std", "derive"] }
