[package]
name = "rustible-std"
description = "Rustible standard operations"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[dependencies]
rustible-sdk.workspace = true
regex.workspace = true
serde.workspace = true

[dev-dependencies]
# For `#[rustible::integration_test]` in tests/. Path-only on purpose: cargo
# strips a path-only dev-dependency at publish, so there is no
# rustible -> rustible-std -> rustible cycle on crates.io (same as
# rustible-macros).
rustible = { path = "../rustible" }
