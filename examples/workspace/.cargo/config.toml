# Cross-linking for target binaries. Pure-Rust crates link with the bundled
# rust-lld and the self-contained musl crt that rustup ships; no zig, no
# distro cross-compiler needed. Add a target with `rustup target add <triple>`.

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
