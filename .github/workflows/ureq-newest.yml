name: ureq newest

# `rustible-std` uses ureq's `unversioned` API, which ureq exempts from
# semver, so a 3.x minor release may change it. Every fresh playbook
# workspace resolves its own lock and gets the newest 3.x, so this checks
# that release before users meet it: update ureq alone, then run the tests
# of the crates that use it. Never on pull requests: it tests what crates.io
# serves today, not the change under review. Run it by hand from the Actions
# tab with "Run workflow".
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ureq-newest:
    name: "Test (T1): unit & fake (Linux, newest ureq 3.x)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Keyed on the committed lock, before the update below; falls back to
      # the T1 job's cache, which holds everything but the new ureq.
      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ureq-newest-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ureq-newest-cargo-
            ci-check-cargo-

      # A user's workspace declares no `rust-version`, so its lock takes the
      # newest 3.x their toolchain builds; `allow` does the same here instead
      # of holding to the workspace's MSRV.
      - name: Update ureq to the newest 3.x
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
        run: |
          cargo update -p ureq
          cargo tree -i ureq --depth 0

      # `rustible-std` holds both `unversioned` uses (the crypto provider and
      # `http::transport`); `rustible-github` sends through `rustible_std::http`.
      - run: cargo test -p rustible-std -p rustible-github
