name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Test - unit & fake, lint, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-check-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-check-cargo-

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # `--lib` keeps the `rustible` facade crate's docs from colliding with
      # the `rustible` binary of rustible-cli in the output directory.
      - name: Rustdoc must be warning-free
        run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Build - MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept in step with `rust-version` in the workspace manifest. Let-chains
      # need 1.88, so this is a real floor, not a guess. `ring` (the TLS
      # provider, see rustible-std::tls) declares a far lower MSRV than that,
      # unlike the `graviola` it replaced, which forced 1.89.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - run: cargo check --workspace --all-targets

  example-workspace:
    name: Build - example workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `examples/workspace` is excluded from the workspace on purpose: it is a
      # user's workspace, wired to these crates by path, and it exercises the
      # generated build script and the playbook registry.
      - run: cargo build --manifest-path examples/workspace/Cargo.toml

  macos:
    name: Build - macOS controller
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # A mac is a supported *controller*: it builds the CLI natively and
      # cross-builds playbook binaries for the Linux musl targets. It is never
      # a target (vision 5.3, Linux musl only), which is why the local probe
      # refuses it. Xcode's command line tools ship the clang that ring needs,
      # so nothing is installed here.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-macos-cargo-

      - run: clang --version

      - run: cargo test --workspace

      # The property that matters: a mac produces a Linux playbook binary,
      # with Apple clang and the musl headers the CLI carries. The compiler
      # environment comes from `rustible toolchain check --print-env`, which
      # is the same code `playbook run` uses; calling cargo directly here
      # would set nothing and fail on `x86_64-linux-musl-gcc`, which is the
      # error that whole module exists to prevent.
      - name: Cross-build a playbook for both Linux targets
        run: |
          set -euo pipefail
          cargo build --release -p rustible-cli
          RUSTIBLE=$PWD/target/release/rustible
          "$RUSTIBLE" toolchain check
          cd examples/workspace
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            ( eval "$("$RUSTIBLE" toolchain check --target "$t" --print-env)"
              RUSTIBLE_PLAYBOOK=hello \
                cargo build --features selected --profile dist --target "$t" )
            file "target/$t/dist/workspace"
          done

  harness:
    name: Test - Docker - Debian, Ubuntu, Alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-harness-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-harness-cargo-

      # The harness builds each test as a static musl binary and runs it inside
      # the images the test names; without RUSTIBLE_INTEGRATION=1 these tests
      # skip themselves (vision 8, tier 3).
      - name: Integration tests in containers
        run: cargo test -p rustible-std --tests
        env:
          RUSTIBLE_INTEGRATION: "1"

  # Tier 4, the machine tier: a real virtual machine over a real SSH transport,
  # with a real init system, a real sudo, and a live /proc/sys. A container has
  # none of those -- it shares the host kernel, so `it_sysctl_present.rs` has to
  # run with `.apply_now(false)` and assert only on the drop-in file.
  #
  # GitHub's Linux runners expose /dev/kvm, so the x86_64 guest is genuinely
  # accelerated (`<domain type='kvm'>`); the aarch64 guest is interpreted by
  # qemu, which is what makes it the slowest job here and also the only
  # automated check that an operation behaves the same on another architecture.
  machine:
    # Job names say the mechanism first, then what it ran against, because a
    # reader of a CI run has none of this file's context: `Test - VM - Debian
    # 12 - aarch64` says where it ran and on what, where "machine tier" said
    # nothing. `distro` and `arch` are matrix data rather than words in the
    # name, so adding a distribution cannot leave a job claiming to test
    # something it does not.
    name: Test - VM - ${{ matrix.distro }} - ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: x86
            distro: Debian 12
            arch: x86_64
            target: x86_64-unknown-linux-musl
            qemu: qemu-system-x86
          - machine: arm
            distro: Debian 12
            arch: aarch64
            target: aarch64-unknown-linux-musl
            # qemu-system-x86 as well: libvirt asks the host's own emulator for
            # the hypervisor version before it will do anything at all.
            qemu: qemu-system-x86 qemu-system-arm qemu-efi-aarch64
    steps:
      - uses: actions/checkout@v4

      # The dependency rule, on a runner: a musl target plus clang. Nothing
      # below installs a cross-gcc, a zig, or a docker image to build in.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-machine-${{ matrix.machine }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-machine-${{ matrix.machine }}-cargo-

      - name: Install vagrant, libvirt and qemu
        run: |
          set -euo pipefail
          # Ubuntu dropped the vagrant package after HashiCorp's licence
          # change, so it comes from HashiCorp's own apt repo. A developer on
          # Ubuntu 24.04 has to do the same; docs/DEVELOPING.md says so.
          wget -qO- https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
          sudo apt-get update -qq
          # dnsmasq-base is what libvirt's NAT network needs; without it
          # `vagrant up` dies on "Unable to find 'dnsmasq' binary in $PATH".
          sudo apt-get install -y -qq --no-install-recommends \
            vagrant \
            libvirt-daemon-system libvirt-clients \
            ${{ matrix.qemu }} qemu-utils \
            dnsmasq-base ebtables iptables \
            ruby-dev libvirt-dev gcc make pkg-config
          # vagrant-libvirt is a Vagrant plugin, not an apt package.
          vagrant plugin install vagrant-libvirt

      - name: Open /dev/kvm and the libvirt socket
        run: |
          set -euo pipefail
          # The libvirt group only exists once the package is installed, so
          # this cannot move above that step. Group membership does not reach a
          # shell that is already running, and `sg` asks for a password when it
          # is not yet live, so widen the socket instead -- this runner is
          # destroyed when the job ends.
          sudo usermod -aG kvm,libvirt "$USER"
          sudo chmod 0666 /dev/kvm
          # Ubuntu socket-activates libvirt, so the unix_sock_* settings in
          # libvirtd.conf are never read: the socket unit owns the permissions.
          sudo mkdir -p /etc/systemd/system/libvirtd.socket.d
          printf '[Socket]\nSocketMode=0666\n' \
            | sudo tee /etc/systemd/system/libvirtd.socket.d/override.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl stop libvirtd.service libvirtd.socket
          sudo systemctl start libvirtd.socket
          # Prove the runner itself reaches libvirt, with no sudo and no sg.
          # If this fails everything after it is meaningless.
          virsh -c qemu:///system version
          # vagrant-libvirt needs a 'default' storage pool and the NAT network;
          # neither is started on a fresh install.
          if ! virsh -c qemu:///system pool-list --all | grep -q default; then
            virsh -c qemu:///system pool-define-as default dir --target /var/lib/libvirt/images
            virsh -c qemu:///system pool-autostart default
            virsh -c qemu:///system pool-start default
          fi
          virsh -c qemu:///system net-start default || true
          virsh -c qemu:///system net-autostart default || true

      - name: Bring the machine up
        run: |
          set -euo pipefail
          cd dev/vagrant
          vagrant up ${{ matrix.machine }}

      - name: Report whether it was accelerated
        run: |
          # `type='kvm'` means /dev/kvm was usable; `type='qemu'` means every
          # instruction is interpreted. Printed rather than asserted: the
          # aarch64 guest is legitimately interpreted on an x86_64 runner.
          virsh -c qemu:///system dumpxml vagrant_${{ matrix.machine }} \
            | grep -E "<domain type" || true

      # Runs the playbook twice and fails unless the second run changes
      # nothing. The second run is the test.
      - name: make vm-test
        run: make vm-test

      - name: Machine state on failure
        if: failure()
        run: |
          virsh -c qemu:///system list --all || true
          cd dev/vagrant && vagrant status || true
